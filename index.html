<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pages contre minutes</title>
<meta name="theme-color" content="#F4F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15141B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pages">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Même monde que le Cockpit D2 : lavande, Bricolage Grotesque + IBM Plex Sans, et le même hippo. */
:root {
  --bg: #F4F3F7; --surface: #FFFFFF; --surface-2: #E9E7F0; --ink: #1D1B26; --ink-2: #514E63; --muted: #6B6880; --line: #DCDAE6; --line-strong: #B9B6CC;
  --accent: #4A4670; --accent-ink: #FFFFFF; --accent-soft: #E4E1F2; --focus: #4A4670;
  --ok: #3E7C5C; --ok-soft: #E1EFE7; --warn: #B8862B; --warn-soft: #F5ECD6; --bad: #B9503F; --bad-soft: #F6E1DD; --pink: #E79AA8; --teal: #2F7A86; --teal-soft: #DCEEF0; --plum: #8A4A7A; --plum-soft: #F1E3EE;
  --hp: #8C88A8; --hp2: #B4B0CC; --hp3: #6A6686; --hpk: #1A1D1B; --hpp: #E79AA8; --hpg: #E3B341; --hpg2: #B5862A;
  --display: "Bricolage Grotesque", "Avenir Next", Avenir, "Helvetica Neue", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r: 16px; --tab: 64px; --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15141B; --surface: #1D1C25; --surface-2: #282633; --ink: #EDECF3; --ink-2: #C5C2D6; --muted: #918EA6; --line: #312F3E; --line-strong: #4B4860;
  --accent: #B4B0CC; --accent-ink: #15141B; --accent-soft: #2E2B3F; --focus: #B4B0CC;
  --ok: #8CC7A9; --ok-soft: #1F3329; --warn: #E3B341; --warn-soft: #3A2F16; --bad: #E58B7B; --bad-soft: #3D211C; --teal: #7FC4CE; --teal-soft: #17323A; --plum: #D69AC6; --plum-soft: #3A2436; } }
:root[data-theme="dark"] {
  --bg: #15141B; --surface: #1D1C25; --surface-2: #282633; --ink: #EDECF3; --ink-2: #C5C2D6; --muted: #918EA6; --line: #312F3E; --line-strong: #4B4860;
  --accent: #B4B0CC; --accent-ink: #15141B; --accent-soft: #2E2B3F; --focus: #B4B0CC;
  --ok: #8CC7A9; --ok-soft: #1F3329; --warn: #E3B341; --warn-soft: #3A2F16; --bad: #E58B7B; --bad-soft: #3D211C; --teal: #7FC4CE; --teal-soft: #17323A; --plum: #D69AC6; --plum-soft: #3A2436; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.45 var(--body); min-height: 100dvh; overflow-x: hidden; }
::selection { background: var(--accent-soft); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3, .display { font-family: var(--display); letter-spacing: -.01em; line-height: 1.1; text-wrap: balance; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.muted { color: var(--muted); } .small { font-size: 13px; } .num { font-variant-numeric: tabular-nums; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ───── Structure ───── */
main { max-width: 620px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(var(--tab) + env(safe-area-inset-bottom) + 24px); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.topbar h1 { font-size: 26px; font-weight: 800; }
.topbar .right, .hero .right { display: flex; align-items: center; gap: 8px; }
.gear { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink-2); box-shadow: 0 2px 0 var(--line); } .gear svg.i { width: 20px; height: 20px; }
.section { margin: 22px 0 12px; } .section h2 { font-size: 17px; font-weight: 700; margin-bottom: 10px; } .section .lead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; } .section .lead h2 { margin: 0; } .section .lead button.link { font: 600 13px var(--body); color: var(--accent); min-height: 0; }
.quests .quest { border-top: 1px solid var(--line); } .quests .quest:first-child { border-top: 0; padding-top: 0; }
.list { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 4px 16px; margin-bottom: 14px; } .list .setrow { padding: 12px 0; } .list label { margin-top: 12px; } .list > :last-child { margin-bottom: 12px; }
.hp-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; } .hp-gallery figure { margin: 0; padding: 12px 6px 10px; border: 2px solid var(--line); border-radius: 14px; display: grid; justify-items: center; gap: 8px; background: var(--surface); } .hp-gallery .hp-unit { width: 52px; } .hp-gallery figcaption { font: 500 11.5px/1.3 var(--body); color: var(--muted); text-align: center; } .hp-gallery figcaption b { display: block; color: var(--ink); font-weight: 600; }
#settings { position: fixed; inset: 0; z-index: 40; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 30px); animation: slidein .28s var(--ease) both; } #settings .inner { max-width: 620px; margin: 0 auto; }
.topbar .sub { display: block; font: 500 13px var(--body); color: var(--muted); margin-top: 2px; letter-spacing: 0; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs div { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { display: grid; justify-items: center; gap: 3px; min-height: var(--tab); padding-top: 8px; font: 600 11.5px var(--body); color: var(--muted); border-radius: 0; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs button[aria-current="page"] svg.i { background: var(--accent-soft); }
nav.tabs svg.i { width: 40px; height: 30px; padding: 4px 9px; border-radius: 10px; stroke-width: 2.1; overflow: visible; }
section.view { animation: fadein .25s ease both; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } }

/* ───── Cartes et boutons « pressables » ───── */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
.card.flat { border-width: 1px; }
.card h2 { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
.card .lead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; } .card .lead h2 { margin: 0; } .card .lead a, .card .lead button.link { font: 600 13px var(--body); color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 14px; font: 700 15px var(--body); letter-spacing: .01em; text-transform: none;
  background: var(--accent); color: var(--accent-ink); border-bottom: 4px solid rgba(0,0,0,.28); transition: transform .08s; }
.btn:active { transform: translateY(3px); border-bottom-width: 1px; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-bottom-width: 4px; }
.btn.ok { background: var(--ok); color: #fff; }
.btn.wide { width: 100%; } .btn.sm { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.btn:disabled { opacity: .5; transform: none; }
.link { font: 600 14px var(--body); color: var(--accent); min-height: 40px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin: 0 -16px 12px; padding-left: 16px; padding-right: 16px; } .chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font: 600 13.5px var(--body); color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font: 600 12px var(--body); background: var(--surface-2); color: var(--ink-2); }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.teal { background: var(--teal-soft); color: var(--teal); }
.tint-warn { background: var(--warn-soft) !important; color: var(--warn) !important; } .tint-ok { background: var(--ok-soft) !important; color: var(--ok) !important; } .tint-teal { background: var(--teal-soft) !important; color: var(--teal) !important; } .tint-bad { background: var(--bad-soft) !important; color: var(--bad) !important; } .tint-plum { background: var(--plum-soft) !important; color: var(--plum) !important; }
.bar.teal i { background: var(--teal); } .bar.plum i { background: var(--plum); } .bar.bad i { background: var(--bad); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.bad { background: var(--bad-soft); color: var(--bad); }
.bar { height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; } .bar i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 999px; transform-origin: left; transform: scaleX(0); transition: transform .5s var(--ease); }
.bar.ok i { background: var(--ok); } .bar.warn i { background: var(--warn); } .bar.thin { height: 8px; }
.row { display: flex; gap: 10px; align-items: center; } .row > * { flex: 1; }
.err { color: var(--bad); font: 500 13.5px var(--body); margin-top: 8px; } .err:empty, .okmsg:empty { display: none; } .okmsg { color: var(--ok); font: 500 13.5px var(--body); margin-top: 8px; }
label { display: block; font: 600 13px var(--body); color: var(--ink-2); margin: 12px 0 5px; }
input, textarea, select { width: 100%; font: 16px var(--body); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 11px 12px; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
textarea { min-height: 140px; resize: vertical; line-height: 1.5; }
input[type=number] { font-variant-numeric: tabular-nums; }
code.copy { display: block; background: var(--surface-2); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; word-break: break-all; color: var(--ink-2); }

/* ───── Accueil ───── */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; margin-bottom: 14px; }
.hero h1 { font-size: 24px; font-weight: 800; }
.hero .greet { font: 500 14px var(--body); color: var(--muted); margin-bottom: 4px; }
.streakpill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font: 700 14px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.streakpill svg.i { width: 18px; height: 18px; } .streakpill.risk { background: var(--bad-soft); color: var(--bad); }
.reserve { display: flex; align-items: center; gap: 12px; padding: 4px 2px 0; }
.reserve .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); flex: none; } .reserve.debt .ic { background: var(--bad-soft); color: var(--bad); }
.reserve b.big { font: 800 22px/1 var(--display); font-variant-numeric: tabular-nums; } .reserve.debt b.big { color: var(--bad); }
.reserve p { font: 500 13px/1.35 var(--body); color: var(--muted); } .reserve .tag { margin-left: auto; white-space: nowrap; flex: none; }
.goal { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.ring { width: 96px; height: 96px; position: relative; } .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); } .ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
.ring .track { stroke: var(--surface-2); } .ring .val { stroke: var(--accent); transition: stroke-dashoffset .6s var(--ease); } .ring.done .val { stroke: var(--ok); }
.ring b { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; font: 800 24px/1 var(--display); font-variant-numeric: tabular-nums; } .ring b small { font: 500 11px/1 var(--body); color: var(--muted); margin-top: 3px; }
.goal p { font-size: 14px; color: var(--ink-2); margin: 6px 0 12px; }
.covers { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 4px 16px 6px; } .covers::-webkit-scrollbar { display: none; }
.cov { flex: none; width: 92px; text-align: left; }
.cov .img { display: block; position: relative; width: 92px; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.cov .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cov .img .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 8px; text-align: center; font: 700 12px/1.2 var(--display); color: #fff; background: var(--bg-ph, var(--accent)); }
.cov .t { margin-top: 7px; font: 600 12.5px/1.25 var(--body); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cov .bar { display: block; margin-top: 5px; }
.cov.add .img { display: grid; place-items: center; border-style: dashed; box-shadow: none; color: var(--accent); background: var(--surface); }

/* ───── Bibliothèque ───── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 12px; }
.grid .cov { width: auto; } .grid .cov .img { width: 100%; }
.grid .cov .st { display: inline-block; margin-top: 4px; font: 600 11px var(--body); color: var(--muted); }
.empty { text-align: center; padding: 30px 16px; color: var(--muted); font-size: 14px; }

/* ───── Objectifs ───── */
.level { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; }
.level .badge { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--plum-soft); color: var(--plum); font: 800 20px var(--display); border: 2px solid var(--plum); }
.level b { font: 700 16px var(--display); } .level span { display: block; font: 500 12.5px var(--body); color: var(--muted); }
.quest { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); } .quest:first-of-type { border-top: 0; padding-top: 4px; }
.quest .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); } .quest.done .ic { background: var(--ok-soft); color: var(--ok); }
.quest b { display: block; font: 600 14.5px var(--body); } .quest .bar { margin-top: 6px; } .quest small { display: block; font: 500 12px var(--body); color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.quest .xp { font: 700 13px var(--display); color: var(--warn); white-space: nowrap; } .quest.done .xp { color: var(--ok); }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bdg { display: grid; justify-items: center; gap: 6px; padding: 12px 6px 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); text-align: center; }
.bdg .ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.bdg b { font: 600 12.5px/1.2 var(--body); } .bdg small { font: 500 11px var(--body); color: var(--muted); }
.bdg.locked { border-style: dashed; } .bdg.locked .ic { background: var(--surface-2); color: var(--line-strong); } .bdg.locked b { color: var(--muted); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; } .cal div { aspect-ratio: 1; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font: 600 11px var(--body); color: var(--muted); }
.cal div.on { background: var(--warn); color: #1D1B26; } .cal div.today { outline: 2px solid var(--accent); outline-offset: -2px; } .cal .lbl { aspect-ratio: auto; background: none; font-size: 10.5px; }

/* ───── Profil ───── */
.figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.figures div { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 10px; } .figures div:nth-child(1) b { color: var(--accent); } .figures div:nth-child(2) b { color: var(--teal); } .figures div:nth-child(3) b { color: var(--plum); }
.figures b { display: block; font: 800 22px/1.1 var(--display); font-variant-numeric: tabular-nums; } .figures span { display: block; font: 500 12px/1.3 var(--body); color: var(--muted); margin-top: 3px; }
.chart { width: 100%; height: auto; display: block; } .chart text { font: 11px var(--body); fill: var(--muted); } .chart .v { fill: var(--ink); font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 14px; } td, th { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; } td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; } th { font-size: 12px; color: var(--muted); font-weight: 600; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); } .setrow:first-of-type { border-top: 0; }
.setrow b { display: block; font: 600 14.5px var(--body); } .setrow span { display: block; font: 500 12.5px var(--body); color: var(--muted); }
.setrow input { width: 88px; text-align: center; padding: 8px; }

/* ───── Hippo ───── */
.hp-unit { position: relative; width: 64px; }
.hp-unit svg { display: block; width: 100%; height: auto; overflow: visible; shape-rendering: crispEdges; transform-origin: 50% 100%; animation: hp-breathe 2.4s steps(2, end) infinite; }
@keyframes hp-breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.045) scaleX(.985); } }
.hp-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: hp-blink 4.6s infinite; } @keyframes hp-blink { 0%, 92%, 100% { transform: scaleY(1); } 95%, 97% { transform: scaleY(.12); } }
.hp-ear { transform-box: fill-box; transform-origin: 50% 100%; animation: hp-ear 6.2s steps(1, end) infinite; } .hp-ear.r { animation-delay: .18s; }
@keyframes hp-ear { 0%, 84%, 100% { transform: none; } 86%, 90% { transform: rotate(-14deg); } 88%, 92% { transform: rotate(10deg); } }
.hp-happy-only, .hp-cheeks, .hp-crown, .hp-spark, .hp-lids { opacity: 0; }
.hp-unit.happy .hp-cheeks, .hp-unit.mood-great .hp-cheeks { opacity: 1; }
.hp-unit.crowned .hp-crown { opacity: 1; transform-box: fill-box; transform-origin: 50% 100%; animation: hp-crown 3s ease-in-out infinite; } @keyframes hp-crown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.25px); } }
.hp-unit.mood-great svg { animation: hp-bounce 1.5s steps(3, end) infinite; } @keyframes hp-bounce { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-3px) scaleY(1.04); } }
.hp-unit.mood-great .hp-spark { animation: hp-spark 1.8s steps(1, end) infinite; } .hp-unit.mood-great .hp-spark.b { animation-delay: .9s; } @keyframes hp-spark { 0%, 100% { opacity: 0; } 20%, 60% { opacity: 1; } }
.hp-unit.mood-down svg { animation-duration: 4.2s; filter: saturate(.45); } .hp-unit.mood-down .hp-ear { animation: none; } .hp-unit.mood-down .hp-ear.l { transform: rotate(-32deg) translateY(.5px); } .hp-unit.mood-down .hp-ear.r { transform: rotate(32deg) translateY(.5px); } .hp-unit.mood-down .hp-lids { opacity: 1; }
.hp-unit.happy .hp-happy-only { opacity: 1; } .hp-unit.happy svg { animation: hp-jump .55s cubic-bezier(.3, 1.6, .5, 1) 2; } @keyframes hp-jump { 0%, 100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-14px) scale(.96, 1.06); } 60% { transform: translateY(0) scale(1.08, .9); } }
.hp-unit.happy .hp-eyes { animation: none; opacity: 0; } .hp-unit.sleepy .hp-eyes { animation: none; transform: scaleY(.12); } .hp-unit.sleepy svg { animation-duration: 4s; }
.hp-unit.mood-down.happy .hp-lids, .hp-unit.sleepy .hp-lids { opacity: 0; }
/* colère : sourcils, oreilles en arrière, tremblement ; pleurs : oreilles tombées, larmes ; inquiétude : goutte de sueur ; toucher : pirouette */
.hp-brows, .hp-sad, .hp-tear, .hp-sweat { opacity: 0; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dayKey = d => new Date(d).toLocaleDateString("sv");
const fmtDate = d => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const fmtDateTime = d => new Date(d).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const plural = (n, w) => `${n} ${w}${Math.abs(n) > 1 ? "s" : ""}`;
const DEMO = new URLSearchParams(location.search).has("demo");

// ───────────── Couche de données : Supabase, ou jeu de démonstration en mémoire (?demo) ─────────────
const api = DEMO ? demoApi() : supabaseApi();

function supabaseApi() {
  const cfg = window.LE_CONFIG || {};
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) return { unconfigured: true };
  const sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const all = async q => { const { data, error } = await q; if (error) throw error; return data; };
  const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; };
  return {
    url: cfg.supabaseUrl, anonKey: cfg.supabaseAnonKey,
    session: async () => (await sb.auth.getSession()).data.session,
    signIn: async (email, password) => { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
    signOut: () => sb.auth.signOut(),
    claimOwner: () => rpc("claim_owner"),
    load: async () => {
      const [config, books, readings, sessions, ledger, audits] = await Promise.all([
        all(sb.from("app_config").select("*")), all(sb.from("books").select("*").order("started_at", { ascending: false })),
        all(sb.from("readings").select("*").order("page_start")), all(sb.from("sessions").select("*").order("started_at")),
        all(sb.from("ledger").select("*")), all(sb.from("audits").select("*")) ]);
      return { config: config[0], books, readings, sessions, ledger, audits };
    },
    addBook: b => all(sb.from("books").insert(b)),
    updateBook: (id, patch) => all(sb.from("books").update(patch).eq("id", id)),
    deleteBook: id => all(sb.from("books").delete().eq("id", id)),
    updateConfig: patch => all(sb.from("app_config").update(patch).eq("id", 1)),
    logReading: (secret, label, pageEnd, summary) => rpc("log_reading", { p_secret: secret, p_book: label, p_page_end: pageEnd, p_summary: summary }),
    editSummary: (id, summary) => rpc("edit_summary", { p_reading: id, p_summary: summary }),
    submitAudit: (week, app, minutes) => rpc("submit_audit", { p_week_start: week, p_app: app, p_real_minutes: minutes }),
  };

// Humeurs, du plus urgent au plus calme. Chaque humeur a sa posture ; l'hippo réagit aussi quand on le touche.
function hippoMood() {
  const st = streakInfo(), h = new Date().getHours(), todayP = pagesOn(todayKey()), bal = balance(), lost = pref("lastStreak", 0);
  if (todayP >= goalPages()) return { cls: "mood-great crowned", say: `Objectif du jour atteint, ${todayP} pages. Tu peux souffler.` };
  if (st.cur === 0 && lost >= 2) return { cls: "mood-cry", say: `La série de ${lost} jours est perdue… Une lecture ce soir et on repart.` };
  if (st.atRisk && h >= 20) return { cls: "mood-angry", say: `${h} h passées et toujours rien ? La série de ${st.cur} jours tombe à minuit.` };
  if (bal < 0) return { cls: "mood-worried", say: `${plural(-bal, "minute")} de dette. Ça se rembourse en pages, pas en excuses.` };
  if (h >= 23 || h < 6) return { cls: "sleepy", say: "Il est tard. Quelques pages et au lit ?" };
  if (st.atRisk) return { cls: "", say: `${st.cur} jour${st.cur > 1 ? "s" : ""} d'affilée. Une lecture aujourd'hui pour garder la série.` };
  if (!S.books.some(b => b.status === "en_cours")) return { cls: "mood-down", say: "Pas de livre en cours. Lequel on commence ?" };
  return { cls: st.cur >= 7 ? "crowned" : "", say: todayP ? `${todayP} pages aujourd'hui, encore ${goalPages() - todayP} pour l'objectif.` : "Une page lue et résumée, c'est une minute gagnée." };
}

function hippoCheer() { const h = $(".hp-unit"); if (!h) return; h.classList.remove("happy"); void h.offsetWidth; h.classList.add("happy"); const fx = document.createElement("div"); fx.className = "hp-fx";

// Le gel de série : un jour manqué compte comme lu s'il a été gelé. Appliqué tout seul, au plus un par semaine.
async function applyFreeze() {
  const p = player(), days = readingDays(), y = addDays(todayKey(), -1); if (days.has(y) || days.has(todayKey()) || freezesLeft() <= 0 || p.freezesUsed.includes(y)) return;
  let run = 0, k = addDays(y, -1); while (days.has(k) || p.freezesUsed.includes(k)) { run++; k = addDays(k, -1); } if (!run) return;
  if (p.freezesUsed.some(d => d > addDays(y, -7))) return;
  await savePlayer({ freezesUsed: [...p.freezesUsed, y] }); toast(`Gel de série utilisé pour ${fmtDate(y + "T12:00:00")} : la série tient.`, 3200);
}

}

    <div class="inkrow">${b.status === "en_cours" ? `<button class="btn" data-act="log" data-id="${esc(b.id)}">${ICONS.pen}J'ai lu</button>` : `<button class="btn" data-act="status" data-v="en_cours">Reprendre</button>`}<button class="btn ghost" data-act="export" ${rs.length ? "" : "disabled"}>Exporter</button></div>
    <div class="filhead"><h2>Fil de lecture</h2>${rs.length > 1 ? `<button class="sortbtn" data-act="sort-entries">${bookSort === "recent" ? "Récent d'abord" : "Ordre du livre"}<svg viewBox="0 0 24 24"><path d="M8 5v14M8 19l-3-3M8 19l3-3M16 19V5M16 5l-3 3M16 5l3 3"/></svg></button>` : ""}</div>
    ${rs.length ? `<ol class="fil">${order.map(r => { const n = rs.indexOf(r) + 1; return `<li class="entry" id="e-${esc(r.id)}"><span class="no">${n}</span><div class="fol"><span class="rg">p. ${r.page_start} → ${r.page_end}<small>${plural(r.pages, "page")}</small></span><time>${fmtDateTime(r.created_at)}</time><button class="iconbtn" data-act="edit" data-id="${esc(r.id)}" aria-label="Corriger le résumé de la séance ${n}"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></svg></button></div><div class="txt">${esc(r.summary)}</div></li>`; }).join("")}</ol>` : `<p class="quiet">Pas encore de résumé. Le premier s'écrira ici après ta prochaine lecture.</p>`}
    <h2 style="margin-top:26px;font-size:18px">Ranger</h2>
    <div class="inkrow"><button class="btn ghost sm" data-act="cover">Couverture</button>${b.status === "en_cours" ? `<button class="btn ghost sm" data-act="status" data-v="fini">Marquer fini</button><button class="btn ghost sm" data-act="status" data-v="abandonne">Abandonner</button>` : ""}${rs.length ? "" : `<button class="btn ghost sm" data-act="del-book">Retirer</button>`}</div>
    <p class="facts">Commencé le ${fmtDate(b.started_at)}${b.finished_at ? ` · fini le ${fmtDate(b.finished_at)}` : ""}</p></div>`;
  bookview.hidden = false; bookview.scrollTop = 0;
}
function closeBook() { openBook = null; bookview.hidden = true; bookview.innerHTML = ""; }

// ───────────── Feuilles ─────────────
function openDlg(html) { dlg.innerHTML = `<div class="sheet">${html}</div>`; dlg.showModal(); dlg.querySelector(".sheet").scrollTop = 0; }
dlg.addEventListener("click", e => { if (e.target === dlg || e.target.closest("[data-close]")) dlg.close(); });
function dlgLog(bookId) {
  const list = S.books.filter(b => b.status === "en_cours"), sel = list.find(b => b.id === bookId) || list[0]; if (!sel) return toast("Ajoute d'abord un livre en cours.");
  openDlg(`<form id="flog" autocomplete="off">${readingForm(list, sel, "Valider la lecture")}<button type="button" class="btn ghost wide" style="margin-top:8px" data-close>Annuler</button></form>`);
  wireReadingForm($("#flog"), list, sel, async () => { const before = { p: pagesOn(todayKey()), st: streakInfo().cur, lv: levelInfo().n, bd: badges().filter(b => b.at).length }; dlg.close(); await reload(); celebrate(before); });
}
function celebrate(before) {
  const tp = pagesOn(todayKey()), st = streakInfo(), lv = levelInfo(), nb = badges().filter(b => b.at).length; if (tab !== "home") { tab = "home"; render(); }
  hippoCheer(); const msgs = [];
  if (before.p < goalPages() && tp >= goalPages()) msgs.push("Objectif du jour atteint");
  if (st.cur > before.st) msgs.push(`Série : ${st.cur} jour${st.cur > 1 ? "s" : ""}`);
  if (lv.n > before.lv) msgs.push(`Niveau ${lv.n} · ${lv.name}`);
  if (nb > before.bd) msgs.push("Nouveau succès débloqué");
  if (msgs.length) setTimeout(() => toast(msgs.join(" · "), 3200), 400);
}
let addPick = null, addCtl = null, addTimer = 0;
function openStudy() {
  addPick = null;
  openDlg(`<form id="fadd" autocomplete="off"><h1>Nouveau livre</h1>
    <div class="searchwrap"><label for="aq" class="sr-only">Chercher un titre, un auteur ou un ISBN</label>
      <div class="searchbox"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="aq" type="search" enterkeyhint="search" placeholder="Titre, auteur ou ISBN"><button type="button" id="aqx" aria-label="Effacer la recherche" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
      <div id="sugg" aria-live="polite"></div></div>
    <p class="note" id="ahint">Les suggestions arrivent pendant que tu tapes. Tu peux aussi <button type="button" class="textlink" id="amanual">remplir la fiche à la main</button>.</p>
    <div id="afields" hidden><div class="fiche"><span class="noc big" id="athumb" aria-hidden="true"></span><div style="flex:1;min-width:0"><label for="at" style="margin-top:0">Titre</label><input id="at" required><label for="aa">Auteur</label><input id="aa"></div></div>
      <div class="row"><div><label for="ap">Pages</label><input id="ap" type="number" inputmode="numeric" min="1"></div><div><label for="ac">Tu en es page</label><input id="ac" type="number" inputmode="numeric" min="0" value="0"></div></div>
      <div id="aeds" class="edchips" aria-label="Autres éditions"></div><p class="note">Vérifie le nombre de pages sur ton exemplaire. Les pages déjà lues ne rapportent pas de minutes.</p></div>
    <div class="err" id="aerr"></div><button class="btn wide" id="asubmit" style="margin-top:12px" hidden>Ajouter à la bibliothèque</button><button type="button" class="btn ghost wide" style="margin-top:8px" data-close>Annuler</button></form>`);
  const q = $("#aq"), sugg = $("#sugg"), showFields = () => { $("#afields").hidden = false; $("#asubmit").hidden = false; $("#ahint").hidden = true; };
  const run = async () => {
    const text = q.value.trim(); addCtl?.abort(); $("#aqx").hidden = !text; if (text.length < 3) { sugg.innerHTML = ""; return; }
    addCtl = new AbortController(); const ctl = addCtl; if (!sugg.children.length) sugg.innerHTML = `<p class="note">Recherche…</p>`;
    const show = (list, final) => { if (ctl !== addCtl) return; if (!list.length && !final) return;
      sugg.innerHTML = list.length ? "" : `<p class="note">Rien trouvé. Essaie l'ISBN au dos du livre, ou remplis la fiche à la main.</p>`;
      list.slice(0, 12).forEach(b => { const el = document.createElement("button"); el.className = "hit"; el.type = "button";
        el.innerHTML = `${coverThumb(b)}<span><b>${esc(b.title)}</b><i>${esc(b.author || "Auteur inconnu")}</i><small>${[b.publisher, b.year, b.total_pages ? b.total_pages + " p." : null, b.editions.length > 1 ? b.editions.length + " éditions" : null].filter(Boolean).map(esc).join(" · ")}</small></span>`;
        el.onclick = () => pickSuggestion(b, showFields); sugg.append(el); });
      if (!final && list.length) sugg.insertAdjacentHTML("beforeend", `<p class="note" style="margin:6px 0">D'autres catalogues répondent encore…</p>`); };
    try { show(await searchBooks(text, ctl.signal, l => show(l, false)), true); } catch (err) { if (err.name !== "AbortError" && ctl === addCtl) sugg.innerHTML = `<p class="err">Recherche impossible : vérifie ta connexion, ou remplis la fiche à la main.</p>`; }
  };
  q.addEventListener("input", () => { clearTimeout(addTimer); addTimer = setTimeout(run, 320); });
  q.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(addTimer); run(); q.blur(); } });
  $("#aqx").onclick = () => { q.value = ""; addCtl?.abort(); sugg.innerHTML = ""; $("#aqx").hidden = true; q.focus(); };
  $("#amanual").onclick = () => { showFields(); $("#athumb").textContent = "?"; $("#at").focus(); };
  $("#aeds").onclick = e => { const c = e.target.closest("[data-pages]"); if (!c) return; $("#ap").value = c.dataset.pages; $("#aeds").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === c)); haptic(); };
  $("#fadd").onsubmit = async e => { e.preventDefault(); const btn = $("#asubmit"); btn.disabled = true;
    try { const bk = { title: $("#at").value.trim(), author: $("#aa").value.trim() || null, total_pages: +$("#ap").value || null, current_page: +$("#ac").value || 0, cover_url: addPick?.cover_url || null, openlibrary_key: addPick?.openlibrary_key || null };
      bk.cover_url = await resolveCover({ ...bk, covers: addPick?.covers }); await api.addBook(bk); dlg.close(); libFilter = "en_cours"; if (tab !== "books") tab = "books"; await reload(); toast("Livre ajouté à la bibliothèque"); hippoCheer();
    } catch (err) { $("#aerr").textContent = err.message; btn.disabled = false; } };
  setTimeout(() => q.focus(), 80);
}

// ───────────── Actions ─────────────
tabs.addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; render(); } });
document.addEventListener("click", async e => {
  const bk = e.target.closest("[data-book]"); if (bk && !dlg.open) { openBook = bk.dataset.book; return showBook(); }
  const el = e.target.closest("[data-act]"); if (!el) return; const act = el.dataset.act;
  try {
    if (act === "tab") { tab = el.dataset.tab; render(); }
    else if (act === "close-book") closeBook();
    else if (act === "poke") hippoPoke();
    else if (act === "settings") showSettings();
    else if (act === "wardrobe") showWardrobe();
    else if (act === "close-wardrobe") closeWardrobe();
    else if (act === "ward-cat") { wardCat = el.dataset.v; showWardrobe(); }
    else if (act === "buy") await buyItem(el.dataset.id);
    else if (act === "equip") await equipItem(el.dataset.id);
    else if (act === "close-settings") closeSettings();
    else if (act === "log") dlgLog(el.dataset.id || openBook);
    else if (act === "add-book") openStudy();
    else if (act === "filter") { libFilter = el.dataset.v; render(); }
    else if (act === "cover") dlgCover(openBook);
    else if (act === "edit") dlgEdit(el.dataset.id);
    else if (act === "sort-entries") { bookSort = bookSort === "recent" ? "pages" : "recent"; const y = bookview.scrollTop; showBook(); bookview.scrollTop = y; }
    else if (act === "goto-entry") { const t = document.getElementById("e-" + el.dataset.id); if (t) { t.scrollIntoView({ behavior: "smooth", block: "center" }); t.classList.add("flash"); setTimeout(() => t.classList.remove("flash"), 1400); } }
    else if (act === "export") exportBook();
    else if (act === "status") { const v = el.dataset.v; await api.updateBook(openBook, { status: v, finished_at: v === "fini" ? new Date().toISOString() : null }); await reload(); if (v === "fini") { toast("Livre terminé, bravo."); } }
    else if (act === "del-book") { if (confirm("Retirer ce livre de la bibliothèque ?")) { await api.deleteBook(openBook); closeBook(); await reload(); } }
    else if (act === "goto-audit") { tab = "me"; render(); $("#audit")?.scrollIntoView({ behavior: "smooth" }); }
    else if (act === "audit") { const v = $(`#au-${CSS.escape(el.dataset.app)}`).value; $("#audit-err").textContent = "";
      if (v === "") return void ($("#audit-err").textContent = "Indique un nombre de minutes.");
      const r = await api.submitAudit(dayKey(lastMonday()), el.dataset.app, +v); if (!r.ok) return void ($("#audit-err").textContent = r.error);
      await reload(); toast(r.undeclared ? `${r.undeclared} min non déclarées : dette ajoutée.` : `Rien à signaler pour ${el.dataset.app}.`); }
    else if (act === "save-config") { const apps = $("#apps").value.split("\n").map(s => s.trim()).filter(Boolean); if (!apps.length) return void ($("#cfg-err").textContent = "Garde au moins une appli.");
      setPref("goal", Math.max(1, Math.min(200, +$("#goal").value || 15)));
      await api.updateConfig({ apps, session_cap_min: Math.max(1, +$("#cap-s").value || 30), daily_cap_min: Math.max(1, +$("#cap-d").value || 120) }); await reload(); closeSettings(); toast("Réglages enregistrés"); }
    else if (act === "copy-secret") { await navigator.clipboard.writeText(S.config.secret); $("#copy-ok").textContent = "Copié."; }
    else if (act === "signout") { await api.signOut(); closeSettings(); viewLogin(); }
  } catch (err) { toast(err.message || String(err), 4000); }
});
document.addEventListener("keydown", e => { if (e.key !== "Escape" || dlg.open) return; if (!wardrobeEl.hidden) closeWardrobe(); else if (!settingsEl.hidden) closeSettings(); else if (!bookview.hidden) closeBook(); });

async function reload() { S = await api.load(); const st = streakInfo(); if (st.cur > 0) setPref("lastStreak", st.cur); render(); if (openBook) showBook(); }
async function start() {
  if (api.unconfigured) { app.innerHTML = `<div class="login"><h1>Pages contre minutes</h1><p class="muted">Il manque l'adresse et la clé Supabase dans <code>config.js</code>. En attendant, tu peux <a href="?demo" style="color:var(--accent)">voir la démonstration</a>.</p></div>`; return; }
  if (!(await api.session())) return viewLogin();
  if (!(await api.claimOwner())) { await api.signOut(); return viewLogin("Ce compte n'est pas le propriétaire de cette base."); }
  await reload(); try { await applyFreeze(); await dailyGift(); } catch (err) { console.warn(err); } backfillCovers().catch(() => {});
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && S && !dlg.open) reload().catch(() => {}); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
start().catch(err => { app.innerHTML = `<div class="login"><h1>Oups</h1><p class="err">${esc(err.message || err)}</p></div>`; });
</script>
</body>
</html>
